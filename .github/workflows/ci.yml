name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows (Full Workspace)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy

      - name: Install cargo-deny
        uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2
        with:
          tool: cargo-deny

      - name: Check code formatting
        run: cargo fmt --all --check

      - name: Run clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Run unit & property tests
        run: cargo test --workspace

      - name: Run attack page integration test harness
        run: cargo run -p wavical-integration-tests

      - name: Build workspace (including wavical-native)
        run: cargo build --workspace

  linux:
    name: "Linux (Pure Crates & Grant Table Tests)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy

      - name: Check code formatting
        run: cargo fmt --all --check

      - name: Run clippy on pure crates
        run: cargo clippy -p wavical-ipc -p wavical-protocol -p wavical-config -p wavical-cli -- -D warnings

      - name: Run pure-crate tests (including grant table isolation and limits)
        run: cargo test -p wavical-ipc -p wavical-protocol -p wavical-config -p wavical-cli

      - name: Build pure binaries and crates
        run: cargo build -p wavical-ipc -p wavical-protocol -p wavical-config -p wavical-cli

  cli-e2e:
    name: "CLI E2E Workflow & Smoke"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Build wavical binaries
        run: cargo build -p wavical-cli

      - name: Verify help commands exit without panic
        run: |
          ./target/debug/wavical --help
          ./target/debug/wavical init --help
          ./target/debug/wavical dev --help
          ./target/debug/wavical build --help
          ./target/debug/wca --help

      - name: End-to-end init and build workflow
        run: |
          ./target/debug/wavical init test-app
          cd test-app
          ../target/debug/wavical build
          test -f dist/index.html
          test -f dist/styles.css
          test -f dist/wavical-manifest.json

  security:
    name: Security & Supply Chain (Audit & Deny)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Install cargo-audit and cargo-deny
        uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2
        with:
          tool: cargo-audit,cargo-deny

      - name: Run cargo audit
        run: cargo audit

      - name: Run cargo deny check
        run: cargo deny check
