[workspace]
resolver = "2"
members = [
    "crates/wavical-ipc",
    "crates/wavical-protocol",
    "crates/wavical-shell",
    "crates/wavical-config",
    "crates/wavical-cli",
    "crates/wavical-native",
    "tests/integration",
    "tests/audit",
]
exclude = [
    "fuzz",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
