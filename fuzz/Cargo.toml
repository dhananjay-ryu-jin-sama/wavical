[package]
name = "wavical-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1.0"
wavical-ipc = { path = "../crates/wavical-ipc" }
wavical-protocol = { path = "../crates/wavical-protocol" }
wavical-ai = { path = "../crates/wavical-ai" }

[[bin]]
name = "parse_message"
path = "fuzz_targets/parse_message.rs"
test = false
doc = false

[[bin]]
name = "capability_dispatch"
path = "fuzz_targets/capability_dispatch.rs"
test = false
doc = false

[[bin]]
name = "resolve_path"
path = "fuzz_targets/resolve_path.rs"
test = false
doc = false

[[bin]]
name = "native_request_parser"
path = "fuzz_targets/native_request_parser.rs"
test = false
doc = false

[[bin]]
name = "grant_table"
path = "fuzz_targets/grant_table.rs"
test = false
doc = false

[[bin]]
name = "ai_request_parser"
path = "fuzz_targets/ai_request_parser.rs"
test = false
doc = false

[[bin]]
name = "catalog_parser"
path = "fuzz_targets/catalog_parser.rs"
test = false
doc = false

[[bin]]
name = "chunker"
path = "fuzz_targets/chunker.rs"
test = false
doc = false
