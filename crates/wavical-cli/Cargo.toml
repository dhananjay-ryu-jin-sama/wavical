[package]
name = "wavical-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "wavical"
path = "src/bin/wavical.rs"

[[bin]]
name = "wca"
path = "src/bin/wca.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
wavical-config = { path = "../wavical-config" }
wavical-ipc = { path = "../wavical-ipc" }
wavical-ai = { path = "../wavical-ai" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
notify = "6.1"
ctrlc = "3.4"
rpassword = "7.5.4"
keyring = "4.2.0"

[dev-dependencies]
tempfile = "3"

[target."cfg(windows)".dependencies]
windows-registry = "0.100.0"
