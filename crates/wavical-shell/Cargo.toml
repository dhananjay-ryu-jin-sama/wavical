[package]
name = "wavical-shell"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
default = []
dev-shell = []
test-probe = []

[[bin]]
name = "wavical-shell"
path = "src/main.rs"

[[bin]]
name = "wavical-shell-dev"
path = "src/bin/wavical_shell_dev.rs"
required-features = ["dev-shell"]

[[bin]]
name = "wavical-shell-test-probe"
path = "src/bin/wavical_shell_test_probe.rs"
required-features = ["test-probe"]

[dependencies]
tao = "0.37.1"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
wavical-protocol = { path = "../wavical-protocol" }
wavical-ipc = { path = "../wavical-ipc" }
wavical-config = { path = "../wavical-config" }
wavical-native = { path = "../wavical-native" }
wavical-ai = { path = "../wavical-ai" }
wavical-netpolicy = { path = "../wavical-netpolicy" }
sha2 = "0.11.1"
hex = "0.4.3"
url = "2.5.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.151"
clap = { version = "4.5", features = ["derive", "env"] }
wry = "0.57.0"
muda = "0.21.2"
tray-icon = "0.26.1"
global-hotkey = "0.9.0"
interprocess = "2.2"
ed25519-dalek = "3.0.0"
getrandom = "0.3"
zip = { version = "9.3.0", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
win32job = "2.0.3"

[dev-dependencies]
tempfile = "3"