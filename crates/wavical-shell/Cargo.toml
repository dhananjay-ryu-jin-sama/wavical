[package]
name = "wavical-shell"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
tao = "0.37.1"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
wavical-protocol = { version = "0.1.0", path = "../wavical-protocol" }
wavical-ipc = { version = "0.1.0", path = "../wavical-ipc" }
wavical-native = { version = "0.1.0", path = "../wavical-native" }
wavical-ai = { version = "0.1.0", path = "../wavical-ai" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.151"
clap = { version = "4.5", features = ["derive", "env"] }
wry = "0.57.0"
muda = "0.21.2"
tray-icon = "0.26.1"
global-hotkey = "0.9.0"